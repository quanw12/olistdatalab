# Source contract for the Olist CSVs.
#
# What each table must look like when it lands. The ingest step checks this before anything is
# published to bronze: a missing column or a broken primary key stops the run (severity error);
# row-level oddities are counted and logged (severity warn) because they are facts about the
# business, not broken data.
#
# timestamp_format applies to every column listed under timestamps. Values are Sao Paulo local
# time with no zone; staging models convert them to UTC.

timestamp_format: "%Y-%m-%d %H:%M:%S"

tables:
  orders:
    file: olist_orders_dataset.csv
    grain: one row per order
    columns: [order_id, customer_id, order_status, order_purchase_timestamp, order_approved_at,
              order_delivered_carrier_date, order_delivered_customer_date,
              order_estimated_delivery_date]
    primary_key: [order_id]
    not_null: [customer_id, order_status, order_purchase_timestamp, order_estimated_delivery_date]
    accepted_values:
      order_status: [created, approved, invoiced, processing, shipped, delivered, canceled,
                     unavailable]
    timestamps: [order_purchase_timestamp, order_approved_at, order_delivered_carrier_date,
                 order_delivered_customer_date, order_estimated_delivery_date]

  order_items:
    file: olist_order_items_dataset.csv
    grain: one row per item line inside an order
    columns: [order_id, order_item_id, product_id, seller_id, shipping_limit_date, price,
              freight_value]
    primary_key: [order_id, order_item_id]
    not_null: [product_id, seller_id, price, freight_value]
    numeric: [order_item_id, price, freight_value]
    timestamps: [shipping_limit_date]

  order_payments:
    file: olist_order_payments_dataset.csv
    grain: one row per payment of an order (voucher + card = 2 rows)
    columns: [order_id, payment_sequential, payment_type, payment_installments, payment_value]
    primary_key: [order_id, payment_sequential]
    not_null: [payment_type, payment_value]
    accepted_values:
      payment_type: [credit_card, boleto, voucher, debit_card, not_defined]
    numeric: [payment_sequential, payment_installments, payment_value]

  order_reviews:
    file: olist_order_reviews_dataset.csv
    grain: one review of one order (a few review_ids cover several orders)
    columns: [review_id, order_id, review_score, review_comment_title, review_comment_message,
              review_creation_date, review_answer_timestamp]
    primary_key: [review_id, order_id]
    not_null: [review_score]
    accepted_values:
      review_score: ["1", "2", "3", "4", "5"]
    timestamps: [review_creation_date, review_answer_timestamp]

  customers:
    file: olist_customers_dataset.csv
    grain: one customer id per order; customer_unique_id is the real person
    columns: [customer_id, customer_unique_id, customer_zip_code_prefix, customer_city,
              customer_state]
    primary_key: [customer_id]
    not_null: [customer_unique_id, customer_state]

  sellers:
    file: olist_sellers_dataset.csv
    grain: one row per seller
    columns: [seller_id, seller_zip_code_prefix, seller_city, seller_state]
    primary_key: [seller_id]

  products:
    file: olist_products_dataset.csv
    grain: one row per product
    columns: [product_id, product_category_name, product_name_lenght, product_description_lenght,
              product_photos_qty, product_weight_g, product_length_cm, product_height_cm,
              product_width_cm]
    primary_key: [product_id]
    numeric: [product_weight_g, product_length_cm, product_height_cm, product_width_cm]

  category_translation:
    file: product_category_name_translation.csv
    grain: one Portuguese category with its English name
    columns: [product_category_name, product_category_name_english]
    primary_key: [product_category_name]

  geolocation:
    file: olist_geolocation_dataset.csv
    grain: one lat/lng point; a zip prefix has many points (no key, dedupe before joining)
    required: false
    columns: [geolocation_zip_code_prefix, geolocation_lat, geolocation_lng, geolocation_city,
              geolocation_state]
    numeric: [geolocation_lat, geolocation_lng]
