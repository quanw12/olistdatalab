name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dbt]"
      - name: Lint
        run: ruff check .
      - name: Unit and end-to-end tests
        run: pytest
      - name: Full batch on the synthetic sample
        run: |
          olist sample --orders 3000
          olist run --offline
          olist ai-label --provider keyword --limit 1000
          olist ai-eval
