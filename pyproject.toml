[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OlistDataLab"
version = "0.1.0"
description = "End-to-end data platform on the Olist e-commerce dataset: lakehouse, dbt, streaming, Spark, ML and LLM enrichment"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anh Quân" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dbt = ["dbt-core>=1.10", "dbt-duckdb>=1.9"]
ml = ["scikit-learn>=1.5", "mlflow>=3.0", "joblib"]
ai = ["anthropic>=0.40"]
stream = ["confluent-kafka>=2.5"]
spark = ["pyspark>=3.5,<4"]
postgres = ["psycopg[binary]>=3.2"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]

[project.scripts]
olist = "olist_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"olist_platform.contracts" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
